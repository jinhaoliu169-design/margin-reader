<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="俄语口试 59 题中俄对照练习：逐句慢速朗读、逐词中文注释和俄语单词点读。"
    />
    <meta name="theme-color" content="#f3efe4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="俄语口试" />
    <title>俄语口试练习 · 59 问</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/icons/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
    <link rel="preload" href="assets/fonts/PTSerif-Regular.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="assets/fonts/SourceSansPro-Regular.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#questions">跳到题目</a>

    <svg class="icon-library" aria-hidden="true">
      <symbol id="icon-play" viewBox="0 0 24 24">
        <path d="M8.4 6.7v10.6l9-5.3-9-5.3Z" />
      </symbol>
      <symbol id="icon-stop" viewBox="0 0 24 24">
        <rect x="7" y="7" width="10" height="10" rx="1.5" />
      </symbol>
      <symbol id="icon-search" viewBox="0 0 24 24">
        <circle cx="10.8" cy="10.8" r="6.2" />
        <path d="m15.3 15.3 4.2 4.2" />
      </symbol>
      <symbol id="icon-close" viewBox="0 0 24 24">
        <path d="m7 7 10 10M17 7 7 17" />
      </symbol>
      <symbol id="icon-volume" viewBox="0 0 24 24">
        <path d="M5 10v4h3.4l4.1 3.2V6.8L8.4 10H5Z" />
        <path d="M15.7 9.2a4.2 4.2 0 0 1 0 5.6M18 7a7.2 7.2 0 0 1 0 10" />
      </symbol>
      <symbol id="icon-book" viewBox="0 0 24 24">
        <path d="M4.5 5.5a2 2 0 0 1 2-2H11v16H6.5a2 2 0 0 0-2 2v-16Z" />
        <path d="M19.5 5.5a2 2 0 0 0-2-2H13v16h4.5a2 2 0 0 1 2 2v-16Z" />
      </symbol>
      <symbol id="icon-check" viewBox="0 0 24 24">
        <path d="m5 12.5 4.2 4.2L19 7" />
      </symbol>
      <symbol id="icon-trash" viewBox="0 0 24 24">
        <path d="M5 7h14M9 7V4.5h6V7M7.5 7l.8 12h7.4l.8-12M10 10.5v5M14 10.5v5" />
      </symbol>
      <symbol id="icon-restore" viewBox="0 0 24 24">
        <path d="M5 8.5A8 8 0 1 1 4.5 15" />
        <path d="M5 4.5v4h4" />
      </symbol>
    </svg>

    <header class="topbar">
      <a class="brand" href="#top" aria-label="返回顶部">
        <span class="brand-mark" aria-hidden="true">
          <svg><use href="#icon-book"></use></svg>
        </span>
        <span class="brand-copy">
          <span class="brand-ru" lang="ru">Русский</span>
          <span class="brand-cn">俄语口试训练册</span>
        </span>
      </a>

      <div class="speed-control" role="group" aria-label="朗读速度">
        <span class="speed-label">朗读速度</span>
        <div class="speed-options">
          <button class="speed-option" type="button" data-rate="0.5" aria-pressed="false">0.50×</button>
          <button class="speed-option is-active" type="button" data-rate="0.75" aria-pressed="true">0.75×</button>
          <button class="speed-option" type="button" data-rate="1" aria-pressed="false">1.00×</button>
        </div>
      </div>
    </header>

    <div class="page-grid" id="top">
      <aside class="sidebar" aria-label="题目分类">
        <div class="sidebar-heading">
          <span>题目目录</span>
          <span class="question-total">59 问</span>
        </div>

        <nav class="category-nav" id="category-nav">
          <button class="category-button is-active" type="button" data-category="all" aria-pressed="true">
            <span class="category-label"><span class="category-zh">全部题目</span></span>
            <span class="category-count">59</span>
          </button>
        </nav>

        <div class="voice-status is-ready" id="voice-status" role="status" aria-live="polite">
          <span class="voice-dot"></span>
          <span class="voice-status-text">逐词点读已启用 · 俄语音频</span>
        </div>
      </aside>

      <main class="main-content">
        <section class="intro" aria-labelledby="page-title">
          <div class="intro-copy">
            <h1 id="page-title">先听清一句，<br /><em>再说准一句。</em></h1>
            <p>
              俄语口试 59 道问答。点击播放键慢速跟读整句，点任意俄语单词单独听发音；每句下方都标注中文词义。
            </p>
          </div>

          <div class="study-note" aria-label="使用方法">
            <span class="study-note-icon" aria-hidden="true">
              <svg><use href="#icon-volume"></use></svg>
            </span>
            <div>
              <strong>一句一听</strong>
              <span>点句首播放整句，点单词单独跟读；完成后打勾，重复题可删除标灰。</span>
              <span class="offline-status is-caching" id="offline-status">
                首次联网正在准备离线内容…
              </span>
            </div>
            <span class="study-note-wave" aria-hidden="true">
              <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
            </span>
          </div>
        </section>

        <section class="filterbar" aria-label="查找题目">
          <label class="search-field">
            <svg aria-hidden="true"><use href="#icon-search"></use></svg>
            <span class="sr-only">搜索俄语、中文或关键词</span>
            <input
              id="search"
              type="search"
              placeholder="搜索俄语、中文或关键词"
              autocomplete="off"
              spellcheck="false"
            />
            <button class="clear-search" id="clear-search" type="button" aria-label="清除搜索" hidden>
              <svg aria-hidden="true"><use href="#icon-close"></use></svg>
            </button>
          </label>
          <p class="result-summary" id="result-summary" aria-live="polite">59 道题</p>
        </section>

        <div class="question-sections" id="questions"></div>

        <section class="empty-state" id="empty-state" hidden>
          <div class="empty-index" aria-hidden="true">?</div>
          <h2>没有找到这道题</h2>
          <p>试试换一个俄语单词、中文词组，或切换到“全部题目”。</p>
          <button class="text-button" id="reset-filters" type="button">清除筛选</button>
        </section>

        <footer class="page-footer">
          <p>首次联网完成后可断网使用；整句和全部单词发音均已离线缓存。</p>
          <p>题库来源：刘锦濠《俄语口试简单回答》中俄对照文档。</p>
        </footer>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="data.js"></script>
    <script src="glossary.js"></script>
    <script src="word-audio.js"></script>
    <script src="app.js"></script>
  </body>
</html>
